
name: St Pauli Ticket Monitor

on:
  schedule:
    - cron: "0 */5 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Was soll ausgeführt werden?"
        required: true
        type: choice
        default: check
        options:
          - check
          - test

permissions:
  contents: write

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

jobs:
  check-websites:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        
      - name: Aktuellen GitHub-Stand synchronisieren
        run: git pull --rebase origin main

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Websites prüfen oder Telegram testen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi

      - name: Neuen Stand speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update monitoring state"
            git push
          fi
